name: CI

on:
  pull_request:
  # Pushes to release branches run CI through the Release workflow.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (Node ${{ matrix.node }}, NestJS 11)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build
      - name: Public API report is up to date
        run: npm run api:check
      - run: npm run lint:package
      - run: npm run test:compat

  nest-12:
    name: Runtime compatibility (Node ${{ matrix.node }}, NestJS 12)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # NestJS 12 is ESM-only, which Jest's CommonJS runtime cannot load, so the
      # built package is exercised with runtime smoke tests instead.
      - run: npm install --no-save @nestjs/common@12 @nestjs/core@12 @nestjs/platform-express@12 @nestjs/testing@12
      - run: npm run test:compat
