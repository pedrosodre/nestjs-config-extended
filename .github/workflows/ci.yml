name: CI

on:
  push:
    branches: [master, next, '[0-9]+.x']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (Node ${{ matrix.node }}, NestJS 11)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run lint:package
      - run: npm run test:compat
      - name: Upload coverage
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7

  nest-12:
    name: Runtime compatibility (Node ${{ matrix.node }}, NestJS 12)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # NestJS 12 is ESM-only, which Jest's CommonJS runtime cannot load, so the
      # built package is exercised with runtime smoke tests instead.
      - run: npm install --no-save @nestjs/common@12 @nestjs/core@12 @nestjs/platform-express@12 @nestjs/testing@12
      - run: npm run test:compat

  sonar:
    name: SonarCloud
    needs: check
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "SONAR_TOKEN is not set, skipping."
            exit 0
          fi
          npx --yes sonarqube-scanner@4.4.0 -Dsonar.token="$SONAR_TOKEN"
