name: Release

on:
  push:
    branches: [master, next, '[0-9]+.x']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # create tags and GitHub releases
      issues: write # comment on released issues
      pull-requests: write # comment on released pull requests
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fallback when npm trusted publishing is not configured. Always defined
          # (empty when the secret is missing) so the ${NPM_TOKEN} reference in
          # .npmrc resolves.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
